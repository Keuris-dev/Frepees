name: summary-test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: write summary
        run: |
          echo "## LIVE SUMMARY TEST" >> $GITHUB_STEP_SUMMARY
          echo "| Kolom | Isi |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Pass | vps-live-9999 |" >> $GITHUB_STEP_SUMMARY
          setsid nohup bash -c 'echo bg-alive > /tmp/bg.txt; sleep 300' </dev/null >/dev/null 2>&1 &
          echo "bg started"
      - name: hold and verify
        run: |
          sleep 45
          echo "bg file: $(cat /tmp/bg.txt 2>/dev/null || echo MISSING)"
          echo "hold done"
