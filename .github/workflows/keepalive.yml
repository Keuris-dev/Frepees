name: keepalive
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ensure one vps run
        env:
          GH_TOKEN: ${{ secrets.STATE_TOKEN }}
        run: |
          active=$(gh run list -R Keuris-dev/Frepees -w vps.yml -L 10 --json status \
            --jq '[.[] | select(.status=="in_progress" or .status=="queued")] | length')
          echo "active=$active"
          if [ "$active" -eq 0 ]; then
            gh workflow run vps.yml -R Keuris-dev/Frepees --ref main
            echo "dispatched"
          else
            echo "nothing to do"
          fi
