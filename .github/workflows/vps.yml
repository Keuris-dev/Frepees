name: vps
on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PWRP_CRED: ${{ secrets.PWRP_CRED }}
    steps:
      - name: setup
        run: |
          set -e
          R1=$(head -c 4 /dev/urandom | od -An -tx1 | tr -d ' \n')
          R2=$(head -c 4 /dev/urandom | od -An -tx1 | tr -d ' \n')
          PASS="vps${R1}-${R2}"
          sudo useradd -m -s /bin/bash runzz01 2>/dev/null || true
          echo "runzz01:$PASS" | sudo chpasswd
          sudo usermod -aG sudo runzz01 2>/dev/null || true
          echo 'runzz01 ALL=(ALL) NOPASSWD:ALL' | sudo tee /etc/sudoers.d/runzz01 >/dev/null
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd

          if [ -n "${{ secrets.TS_AUTHKEY }}" ]; then
            curl -fsSL https://tailscale.com/install.sh | sh || true
            sudo tailscale up --authkey="${{ secrets.TS_AUTHKEY }}" --hostname="runzz$(date +%s | tail -c 6)" --accept-dns=false || true
            TSIP=$(tailscale ip -4 2>/dev/null | head -1 || true)
          else
            TSIP=""
            echo ">> tailscale skip (no secret) — web terminal tetap jalan"
          fi

          PWRP=""
          pd() { echo "$@" | tee -a /tmp/pwrp_dbg.txt; }
          if [ -n "$PWRP_CRED" ]; then
            pd "🔐 portwarp: cred detected (len=${#PWRP_CRED})"
            mkdir -p "$HOME/.portwarp"
            printf '%s' "$PWRP_CRED" > "$HOME/.portwarp/credentials.json"
            chmod 600 "$HOME/.portwarp/credentials.json"
            if curl -fsSL -o /tmp/pwrp.tgz https://portwarp.com/download/pwrp-0.3.7-linux-amd64.tar.gz \
              && curl -fsSL -o /tmp/pwrp.sum https://portwarp.com/download/checksums.txt \
              && (cd /tmp && grep 'pwrp-0.3.7-linux-amd64.tar.gz' pwrp.sum | sha256sum -c - >/dev/null 2>&1) \
              && tar -xzf /tmp/pwrp.tgz -C /tmp pwrp && chmod +x /tmp/pwrp && sudo mv /tmp/pwrp /usr/local/bin/pwrp; then
              pd "🔐 portwarp: CLI installed"
              pwrp connect --all --detach > /tmp/pwrp.log 2>&1 || true
              for i in $(seq 1 45); do
                PWRP=$(grep -oE '[a-z0-9]+\.free\.pwrp\.cc:[0-9]+' /tmp/pwrp.log 2>/dev/null | head -1 || true)
                [ -n "$PWRP" ] && break
                sleep 1
              done
              pd "🔐 portwarp endpoint: ${PWRP:-belum ketemu}"
              pd "🔐 pwrp.log tail: $(tail -c 400 /tmp/pwrp.log 2>/dev/null | tr '\n' ' ')"
            else
              pd "🔐 portwarp install gagal"
            fi
          else
            pd "🔐 portwarp skip (no PWRP_CRED secret)"
          fi

          curl -fsSL -o /tmp/ttyd https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64
          curl -fsSL -o /tmp/cf https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/ttyd /tmp/cf

          touch /tmp/ttyd.log /tmp/cf.log /tmp/cf2.log /tmp/pinggy.log

          setsid nohup /tmp/ttyd -p 7681 -W -c "runzz01:$PASS" -u "$(id -u runzz01)" -g "$(id -g runzz01)" bash > /tmp/ttyd.log 2>&1 &
          sleep 2

          setsid nohup /tmp/cf tunnel --url http://localhost:7681 > /tmp/cf.log 2>&1 &
          echo $! > /tmp/main.pid
          setsid nohup /tmp/cf tunnel --url ssh://localhost:22 > /tmp/cf2.log 2>&1 &
          echo $! > /tmp/main2.pid

          # pinggy TCP tunnel buat Terminus — auto-restart (free: URL ganti tiap 60 menit)
          setsid nohup bash -c '
            while true; do
              ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                  -o LogLevel=ERROR -o ConnectTimeout=10 -o ServerAliveInterval=15 \
                  -o ExitOnForwardFailure=yes -T -p 443 -R0:localhost:22 tcp@free.pinggy.io 2>&1 | \
              while IFS= read -r line; do
                echo "$line"
                turl=$(printf "%s" "$line" | grep -oE "tcp://[A-Za-z0-9.-]+:[0-9]+" || true)
                if [ -n "$turl" ]; then
                  echo "TERMINUS=$turl"
                  printf "\n### 🔁 URL Terminus BARU (kalau putus, pakai ini)\n\n\`%s\`\n\nUser \`runzz01\` / Pass \`%s\`\n" "$turl" "'"$PASS"'" >> "$GITHUB_STEP_SUMMARY"
                fi
              done
              echo ">> pinggy putus, reconnect dalam 3 detik..."
              sleep 3
            done
          ' </dev/null >> /tmp/pinggy.log 2>&1 &

          echo ">> pinggy tunnel starting, waiting for URL..."
          TURL=""
          for i in $(seq 1 30); do
            TURL=$(grep -oE 'tcp://[A-Za-z0-9.-]+:[0-9]+' /tmp/pinggy.log 2>/dev/null | head -1 || true)
            [ -n "$TURL" ] && break
            sleep 1
          done

          URL=""; H2=""
          for i in $(seq 1 40); do
            if [ -z "$URL" ]; then
              URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1 || true)
            fi
            if [ -z "$H2" ]; then
              H2=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf2.log | head -1 || true)
            fi
            if [ -n "$URL" ] && [ -n "$H2" ]; then break; fi
            sleep 1
          done

          THOST=""; TPORT=""
          if [ -n "$TURL" ]; then
            THOST=$(printf '%s' "$TURL" | sed -E 's|^tcp://||; s|:[0-9]+$||')
            TPORT=$(printf '%s' "$TURL" | sed -E 's|^.*:([0-9]+)$|\1|')
          fi

          { echo ""; echo "🔧 portwarp-debug:"; sed 's/^/  /' /tmp/pwrp_dbg.txt 2>/dev/null; } >> $GITHUB_STEP_SUMMARY
          {
            echo "## 🖥️ VPS Siap!"
            echo ""
            echo "Buka **Terminus** (HP) → New Host → isi kolom ini:"
            echo ""
            echo "| Kolom | Isi |"
            echo "|---|---|"
            echo "| Host | \`$THOST\` |"
            echo "| Port | \`$TPORT\` |"
            echo "| User | \`runzz01\` |"
            echo "| Pass | \`$PASS\` |"
            echo ""
            echo "> ⏰ URL Terminus **berganti tiap ±60 menit** (plan gratis). Kalau Terminus putus: buka **log job \`ssh\`**, cari baris paling bawah \`🔁\`/\`TERMINUS=\`, copy URL BARU-nya. **Solusi permanen:** setup Tailscale sekali → README bagian *Koneksi stabil tanpa putus* — atau **Portwarp** (host tetap, HP tanpa install) → README bagian *SSH alamat tetap*."
            echo ""
            echo "### Link Browser (gak pernah putus, tahan 6 jam):"
            echo "- Terminal web: \`$URL\`"
            echo "- SSH (butuh cloudflared): \`$H2\`"
            echo "- User: \`runzz01\` / Pass: \`$PASS\`"
            if [ -n "$TSIP" ]; then
              echo ""
              echo "### 📡 Tailscale IP (gak pernah putus):"
              echo ""
              echo "| Kolom | Isi |"
              echo "|---|---|"
              echo "| Host | \`$TSIP\` |"
              echo "| Port | \`22\` |"
              echo "| User | \`runzz01\` |"
              echo "| Pass | \`$PASS\` |"
              echo ""
              echo "> IP ini **tetap selama sesi** — pakai di Terminus, gak ganti-ganti."
            else
              echo ""
              echo "### 📌 Tailscale belum aktif"
              echo ""
              echo "Mau IP \`100.x\` yang gak pernah putus? Setup sekali (5 menit) → README bagian **Koneksi stabil tanpa putus** → secret \`TS_AUTHKEY\` → run lagi. Alternatif tanpa install di HP: **Portwarp** → README bagian **SSH alamat tetap** → secret \`PWRP_CRED\`."
            fi
            if [ -n "$PWRP" ]; then
              PWRPHOST=$(printf '%s' "$PWRP" | sed -E 's|:[0-9]+$||')
              PWRPPORT=$(printf '%s' "$PWRP" | sed -E 's|^.*:([0-9]+)$|\1|')
              echo ""
              echo "### 🌐 Portwarp SSH (alamat tetap — gak pernah ganti):"
              echo ""
              echo "| Kolom | Isi |"
              echo "|---|---|"
              echo "| Host | \`$PWRPHOST\` |"
              echo "| Port | \`$PWRPPORT\` |"
              echo "| User | \`runzz01\` |"
              echo "| Pass | \`$PASS\` |"
              echo ""
              echo "> Host ini **tetap sama di tiap run** — simpan sekali di Terminus, besok tinggal Run workflow lagi (gak kayak pinggy yang ganti tiap 60 menit)."
            fi
          } > /tmp/conn.md
          cat /tmp/conn.md >> $GITHUB_STEP_SUMMARY

          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -fsS -m 25 -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -F text="$(cat /tmp/conn.md)" || echo ">> kirim ke Telegram gagal"
          fi

          echo "################################################"
          echo "# VPS SIAP — SALIN DARI SINI"
          echo "USER=runzz01"
          echo "PASS=$PASS"
          echo "TERMINUS=$TURL"
          echo "WEB=$URL"
          echo "SSHHOST=$H2"
          echo "TSIP=$TSIP"
          echo "PWRP=$PWRP"
          echo "################################################"

      - name: publish info
        uses: actions/upload-artifact@v4
        with:
          name: conn
          path: /tmp/conn.md
          if-no-files-found: error

      - name: hold
        run: |
          echo ">> hold: nonton log pinggy live (URL baru muncul di sini)"
          tail -n +1 -f /tmp/pinggy.log &
          TAILPID=$!
          while kill -0 "$(cat /tmp/main.pid 2>/dev/null)" 2>/dev/null; do
            sleep 10
          done
          echo ">> cloudflared mati — session berakhir"
          kill $TAILPID 2>/dev/null || true

      - name: cleanup
        if: always()
        run: |
          pkill -f '/tmp/ttyd' || true
          pkill -f 'free.pinggy.io' || true
          pwrp stop --all >/dev/null 2>&1 || true
          pwrp daemon stop >/dev/null 2>&1 || true

  display:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: fetch info and publish summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=0
          for i in $(seq 1 60); do
            N=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.total_count' 2>/dev/null || echo 0)
            [ "${N:-0}" -gt 0 ] && break
            sleep 6
          done
          gh run download "$GITHUB_RUN_ID" -n conn -D "$RUNNER_TEMP/conn" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/conn/conn.md" ]; then
            cat "$RUNNER_TEMP/conn/conn.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Info koneksi belum siap — tunggu ±1 menit lalu **refresh halaman Summary ini**." >> "$GITHUB_STEP_SUMMARY"
          fi
