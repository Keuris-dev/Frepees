name: vps
on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: open shell
        run: |
          set -e
          R1=$(head -c 4 /dev/urandom | od -An -tx1 | tr -d ' \n')
          R2=$(head -c 4 /dev/urandom | od -An -tx1 | tr -d ' \n')
          PASS="vps${R1}-${R2}"
          sudo useradd -m -s /bin/bash runzz01 2>/dev/null || true
          echo "runzz01:$PASS" | sudo chpasswd
          sudo usermod -aG sudo runzz01 2>/dev/null || true
          echo 'runzz01 ALL=(ALL) NOPASSWD:ALL' | sudo tee /etc/sudoers.d/runzz01 >/dev/null
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd

          if [ -n "${{ secrets.TS_AUTHKEY }}" ]; then
            curl -fsSL https://tailscale.com/install.sh | sh || true
            sudo tailscale up --authkey="${{ secrets.TS_AUTHKEY }}" --hostname="runzz$(date +%s | tail -c 6)" --accept-dns=false || true
            TSIP=$(tailscale ip -4 2>/dev/null | head -1 || true)
          else
            TSIP=""
            echo ">> tailscale skip (no secret) — web terminal tetap jalan"
          fi

          echo "=========================================="
          echo "PASS=$PASS"
          echo "USER=runzz01"
          echo "TSIP=$TSIP"
          echo "=========================================="

          curl -fsSL -o /tmp/ttyd https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64
          curl -fsSL -o /tmp/cf https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/ttyd /tmp/cf

          /tmp/ttyd -p 7681 -W -c "runzz01:$PASS" -u "$(id -u runzz01)" -g "$(id -g runzz01)" bash > /tmp/ttyd.log 2>&1 &
          sleep 2

          /tmp/cf tunnel --url http://localhost:7681 > /tmp/cf.log 2>&1 &
          CF_PID=$!
          /tmp/cf tunnel --url ssh://localhost:22 > /tmp/cf2.log 2>&1 &
          CF2_PID=$!

          # pinggy TCP tunnel buat Terminus — auto-restart (free: URL ganti tiap 60 menit)
          (
            while true; do
              ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                  -o LogLevel=ERROR -o ConnectTimeout=10 -o ServerAliveInterval=15 \
                  -o ExitOnForwardFailure=yes -T -p 443 -R0:localhost:22 tcp@free.pinggy.io 2>&1 | \
              while IFS= read -r line; do
                echo "$line"
                turl=$(printf '%s' "$line" | grep -oE 'tcp://[A-Za-z0-9.-]+:[0-9]+' || true)
                if [ -n "$turl" ]; then
                  echo "TERMINUS=$turl"
                  printf '\n### 🔁 URL Terminus BARU (kalau putus, pakai ini)\n\n`%s`\n\nUser `runzz01` / Pass `%s`\n' "$turl" "$PASS" >> "$GITHUB_STEP_SUMMARY"
                fi
              done
              echo ">> pinggy putus, reconnect dalam 3 detik..."
              sleep 3
            done
          ) > /tmp/pinggy.log 2>&1 &

          echo ">> pinggy tunnel starting, waiting for URL..."
          TURL=""
          for i in $(seq 1 30); do
            TURL=$(grep -oE 'tcp://[A-Za-z0-9.-]+:[0-9]+' /tmp/pinggy.log 2>/dev/null | head -1 || true)
            [ -n "$TURL" ] && break
            sleep 1
          done

          URL=""; H2=""
          for i in $(seq 1 40); do
            if [ -z "$URL" ]; then
              URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1 || true)
            fi
            if [ -z "$H2" ]; then
              H2=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf2.log | head -1 || true)
            fi
            if [ -n "$URL" ] && [ -n "$H2" ]; then break; fi
            sleep 1
          done

          THOST=""; TPORT=""
          if [ -n "$TURL" ]; then
            THOST=$(printf '%s' "$TURL" | sed -E 's|^tcp://||; s|:[0-9]+$||')
            TPORT=$(printf '%s' "$TURL" | sed -E 's|^.*:([0-9]+)$|\1|')
          fi

          {
            echo "## VPS Siap!"
            echo ""
            if [ -n "$TURL" ]; then
              echo "### Terminus (HP):"
              echo "| Kolom | Isi |"
              echo "|---|---|"
              echo "| Host | \`$THOST\` |"
              echo "| Port | \`$TPORT\` |"
              echo "| User | \`runzz01\` |"
              echo "| Pass | \`$PASS\` |"
              echo ""
              echo "> ⏰ URL Terminus berganti tiap 60 menit (plan gratis). Kalau Terminus putus: **refresh halaman Summary ini** → copy URL TERBARU di bagian paling bawah."
              echo ""
            else
              echo "> ⚠️ Tunnel Terminus gagal start. Pakai link Browser di bawah."
              echo ""
            fi
            echo "### Browser (gak pernah putus, tahan 6 jam):"
            echo "Link: $URL"
            echo "User: runzz01"
            echo "Pass: $PASS"
            [ -n "$TSIP" ] && echo "" && echo "### Tailscale IP: \`$TSIP\`"
          } >> $GITHUB_STEP_SUMMARY

          echo "TERMINUS=$TURL"
          echo "WEB=${URL#https://}"
          echo "USER=runzz01"
          echo "PASS=$PASS"
          echo "SSHHOST=${H2#https://}"
          echo "tunnel up — holding sampai 6 jam"
          wait $CF_PID

      - name: cleanup
        if: always()
        run: |
          pkill -f '/tmp/ttyd' || true
          pkill -f 'free.pinggy.io' || true
