name: vps
on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: open shell
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmate
          tmate -S /tmp/tmate.sock new-session -d -x 210 -y 50
          sleep 2
          echo "--- tmate debug ---"
          tmate -S /tmp/tmate.sock list-sessions || true
          tmate -S /tmp/tmate.sock display-message -p "name=#{session_name} ssh=[#{tmate_ssh}] web=[#{tmate_web}] legacy=[#{ssh}]" || true
          echo "--------------------"
          SSH_CMD=""
          for i in $(seq 1 60); do
            SSH_CMD=$(tmate -S /tmp/tmate.sock display-message -t 0 -p '#{tmate_ssh}' 2>/dev/null || true)
            if [ -z "$SSH_CMD" ]; then
              SSH_CMD=$(tmate -S /tmp/tmate.sock display-message -t 0 -p '#{tmate_web}' 2>/dev/null || true)
            fi
            if [ -n "$SSH_CMD" ]; then break; fi
            sleep 1
          done
          echo "=========================================="
          echo "SSH COMMAND (copy-paste di Termux):"
          echo "$SSH_CMD"
          echo "=========================================="
          if [ -z "$SSH_CMD" ]; then echo "tmate did not print ssh cmd"; exit 1; fi
          SEEN=0
          for i in $(seq 1 900); do
            att=$(tmate -S /tmp/tmate.sock display-message -p '#{session_attached}' 2>/dev/null || echo 0)
            if [ "${att:-0}" -ge 1 ] 2>/dev/null; then SEEN=1; break; fi
            sleep 1
          done
          if [ "$SEEN" = 0 ]; then echo "no client in 15m, exiting"; exit 0; fi
          echo "client connected — holding (grace 60s reconnect)"
          G=0
          while [ "$G" -lt 60 ]; do
            att=$(tmate -S /tmp/tmate.sock display-message -p '#{session_attached}' 2>/dev/null || echo 0)
            if [ "${att:-0}" -ge 1 ] 2>/dev/null; then G=0; else G=$((G+1)); fi
            sleep 1
          done
          echo "client gone — closing session"

      - name: cleanup
        if: always()
        run: rm -f /tmp/tmate.sock || true
