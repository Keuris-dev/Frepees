name: vps
on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: open shell
        run: |
          set -e
          # password pendek + ada dash → gak di-mask GitHub
          R1=$(head -c 4 /dev/urandom | od -An -tx1 | tr -d ' \n')
          R2=$(head -c 4 /dev/urandom | od -An -tx1 | tr -d ' \n')
          PASS="vps${R1}-${R2}"
          sudo useradd -m -s /bin/bash runzz01 2>/dev/null || true
          echo "runzz01:$PASS" | sudo chpasswd
          sudo usermod -aG sudo runzz01 2>/dev/null || true
          echo 'runzz01 ALL=(ALL) NOPASSWD:ALL' | sudo tee /etc/sudoers.d/runzz01 >/dev/null
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd

          if [ -n "${{ secrets.TS_AUTHKEY }}" ]; then
            curl -fsSL https://tailscale.com/install.sh | sh || true
            sudo tailscale up --authkey="${{ secrets.TS_AUTHKEY }}" --hostname="runzz$(date +%s | tail -c 6)" --accept-dns=false || true
            TSIP=$(tailscale ip -4 2>/dev/null | head -1 || true)
          else
            TSIP=""
            echo ">> tailscale skip (no secret) — web terminal & SSH tunnel still work"
          fi

          echo "=========================================="
          echo "PASS=$PASS"
          echo "USER=runzz01"
          echo "TSIP=$TSIP"
          echo "=========================================="

          curl -fsSL -o /tmp/ttyd https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64
          curl -fsSL -o /tmp/cf https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          curl -sL https://github.com/ekzhang/bore/releases/latest/download/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/bore.tar.gz
          tar -xzf /tmp/bore.tar.gz -C /tmp bore
          chmod +x /tmp/ttyd /tmp/cf /tmp/bore

          /tmp/ttyd -p 7681 -W -c "runzz01:$PASS" -u "$(id -u runzz01)" -g "$(id -g runzz01)" bash > /tmp/ttyd.log 2>&1 &
          sleep 2

          /tmp/cf tunnel --url http://localhost:7681 > /tmp/cf.log 2>&1 &
          CF_PID=$!
          /tmp/cf tunnel --url ssh://localhost:22 > /tmp/cf2.log 2>&1 &
          CF2_PID=$!
          /tmp/bore local 22 --to bore.pub > /tmp/bore.log 2>&1 &
          BORE_PID=$!
          echo ">> bore started, waiting for port..."

          URL=""; H2=""; BORE_PORT=""
          for i in $(seq 1 40); do
            if [ -z "$URL" ]; then
              URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1 || true)
            fi
            if [ -z "$H2" ]; then
              H2=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf2.log | head -1 || true)
            fi
            if [ -z "$BORE_PORT" ]; then
              BORE_PORT=$(grep -oE 'bore\.pub:[0-9]+' /tmp/bore.log | head -1 | cut -d: -f2 || true)
            fi
            if [ -n "$URL" ] && [ -n "$H2" ] && [ -n "$BORE_PORT" ]; then break; fi
            sleep 1
          done

          # fallback: kalau bore gagal, print log buat debug
          if [ -z "$BORE_PORT" ]; then
            echo ">> BORE FAILED, log:"
            cat /tmp/bore.log || true
          fi

          {
            echo "## VPS Siap!"
            echo ""
            if [ -n "$BORE_PORT" ]; then
              echo "### Terminus (HP):"
              echo "| Kolom | Isi |"
              echo "|---|---|"
              echo "| Host | \`bore.pub\` |"
              echo "| Port | \`$BORE_PORT\` |"
              echo "| User | \`runzz01\` |"
              echo "| Pass | \`$PASS\` |"
              echo ""
            fi
            echo "### Browser:"
            echo "Link: $URL"
            echo "User: runzz01"
            echo "Pass: $PASS"
            [ -n "$TSIP" ] && echo "" && echo "### Tailscale IP: \`$TSIP\`"
          } >> $GITHUB_STEP_SUMMARY

          echo "BORE=$BORE_PORT"
          echo "WEB=${URL#https://}"
          echo "USER=runzz01"
          echo "PASS=$PASS"
          echo "SSHHOST=${H2#https://}"
          echo "tunnel up — holding sampai 6 jam"
          wait $CF_PID

      - name: cleanup
        if: always()
        run: pkill -f '/tmp/ttyd' || true
