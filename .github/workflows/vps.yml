name: vps
on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: open shell
        run: |
          set -e
          curl -fsSL -o /tmp/ttyd https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64
          curl -fsSL -o /tmp/cf https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/ttyd /tmp/cf
          /tmp/ttyd -p 7681 -W -c runner:Vps12345! bash > /tmp/ttyd.log 2>&1 &
          sleep 2
          /tmp/cf tunnel --url http://localhost:7681 > /tmp/cf.log 2>&1 &
          CF_PID=$!
          URL=""
          for i in $(seq 1 40); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 1
          done
          echo "=========================================="
          echo "TERMINAL (buka di browser HP):"
          echo "$URL"
          echo "user: runner   pass: Vps12345!"
          echo "=========================================="
          if [ -z "$URL" ]; then
            echo "--- cf.log ---"; cat /tmp/cf.log || true
            echo "--- ttyd.log ---"; cat /tmp/ttyd.log || true
            exit 1
          fi
          sudo mkdir -p /run/sshd
          echo 'runner:Vps12345!' | sudo chpasswd
          sudo /usr/sbin/sshd
          (
            while true; do
              ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=15 -R 0:localhost:22 serveo.net 'sleep 540' 2>&1 | sed 's/\x1b\[[0-9;]*m//g' || true
              sleep 2
            done
          ) > /tmp/serveo.log 2>&1 &
          (
            while true; do
              sleep 60
              P=$(grep 'Allocated port' /tmp/serveo.log | tail -1 | grep -oE '[0-9]{4,5}')
              echo "SSH-NOW: ssh -p $P runner@serveousercontent.com  (pass: Vps12345!)"
            done
          ) &
          sleep 20
          P=$(grep 'Allocated port' /tmp/serveo.log | tail -1 | grep -oE '[0-9]{4,5}')
          echo "SSH-NOW: ssh -p $P runner@serveousercontent.com  (pass: Vps12345!)"
          echo "=========================================="
          echo "tunnel up — holding sampai 6 jam"
          wait $CF_PID

      - name: cleanup
        if: always()
        run: pkill -f '/tmp/ttyd' || true
